# Renderium Shader Configuration v1.0
# =====================================
# This file controls all post-processing node parameters.
# Edit values and restart/reload to take effect.
# Lines starting with # are comments. Empty lines are ignored.
#
# Structure: [section] headers group related parameters.
# Key = Value pairs use "key: value" format.
# Boolean: true/false
# Float: decimal numbers (e.g. 0.5, 2.0)
# Int: whole numbers (e.g. 4, 16)
# String: quoted or unquoted text

[renderium]
enabled: true
preset: BALANCED

[depth_of_field]
enabled: true
focal_distance: 20.0
focal_length: 50.0
aperture: 2.8
bokeh_samples: 8
max_size: 24.0

[motion_blur]
enabled: true
strength: 0.5
sample_count: 16
velocity_scale: 1.0

[temporal_aa]
enabled: true
jitter_strength: 0.5
blend_factor: 0.9
history_decay: 0.95

[volumetric_fog]
enabled: true
density: 0.02
scattering: 0.8
absorption: 0.001
light_intensity: 1.5
march_steps: 32
fog_color_r: 0.7
fog_color_g: 0.75
fog_color_b: 0.85

[screen_space_reflection]
enabled: true
max_steps: 64
ray_stride: 0.5
thickness_bias: 0.05
hit_threshold: 0.0001
fade_edge: 0.1
reflection_strength: 0.6

[lens_flare]
enabled: true
ghost_count: 4
ghost_spacing: 0.3
intensity: 0.6
threshold: 0.9
color_bleed: 0.3
halo_radius: 0.15

[chromatic_aberration]
enabled: true
strength: 0.004
radial_strength: 1.0
screen_edge_boost: 0.2

[auto_exposure]
enabled: true
adaptation_speed: 1.0
min_luminance: 0.02
max_luminance: 10.0
logarithmic: true
exposure_key: 0.25
exposure_compensation: 0.0

[bloom]
enabled: false
intensity: 30.0
threshold: 0.8
softness: 0.05
radius: 1.0

[tonemap]
mode: ACES
exposure: 1.0
gamma: 2.2
saturation: 1.1
contrast: 1.05
white_point: 11.2

[vignette]
enabled: true
intensity: 25.0
radius: 0.8
softness: 0.5
color_r: 0.0
color_g: 0.0
color_b: 0.0

[ssao]
enabled: true
quality: HIGH
radius: 0.5
intensity: 1.2
bias: 0.025
fade_start: 10.0
fade_end: 30.0

[shaders]
shader_pack: internal
hot_reload: true
debug_push_constants: false
