# Renderium - Gradle Properties
# 参考 Sodium (caffeinemc) 多加载器架构
# Minecraft 26.2-snapshot-3 + Fabric Loom 1.15.4

org.gradle.jvmargs=-Xmx4G -XX:+UseG1GC -XX:+ParallelRefProcEnabled
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=false

# Custom Gradle repository/caches location (use consistent casing)
gradle.user.home=./.gradle-cache

# Java toolchain — 由 $env:JAVA_HOME 环境变量指定
# 或者在此处显式声明，构建前请确保已正确设置：
# org.gradle.java.home=

# 镜像配置 - 中国镜像加速
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# 阿里云 Maven 镜像
systemProp.maven.repo.aliyun=https://maven.aliyun.com/repository/public

# Minecraft version - 26.2-snapshot-3 (已验证可运行)
minecraft.version=26.2-snapshot-3

# Fabric versions (26.2 compatible)
fabric.loader.version=0.18.5
fabric.api.version=0.146.1+26.2
fabric.loom.version=1.15.4

# BMCLAPI mirror for faster downloads in China
# Alternative: https://download.mcbbs.net/mirror (backup)
loom.assets.root=https://bmclapi2.bangbang93.com/assets
loom.libraries.root=https://bmclapi2.bangbang93.com/maven

# NeoForge version - 21.x for Minecraft 1.21.x (currently disabled)
neoforge.version=21.11.0-beta

# LWJGL version - Unified across all modules
lwjgl.version=3.4.1

# Java settings - Java 25 REQUIRED for Minecraft 26.x+
java.toolchain.languageVersion=JavaLanguageVersion.of(25)

minecraft.jvm.args=-Drenderium.debug=true